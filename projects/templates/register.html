{% extends 'base.html' %}
{%load static%}
{% block content %}
<h1>Register</h1>
<p>Pagina register para registrar un nuevo usuario</p>
{% if error %}
    <p>{{ error }}</p>
{% endif %}
<form action="" method="post">
    {% csrf_token %}
    {{register_form.as_p}}
    <button>
        Save
    </button>
</form>
{%endblock%}
